    status: ported
    matlab_path: "AnalysisTools/CellDatabaseManagement/cellname2nameref.m"
    matlab_last_sync_hash: "cca1cce"
    python_path: "vhlib/CDM/cellname2nameref.py"
    input_arguments:
      - name: cellname
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: nameref
        type_matlab: "struct with fields name, ref"
        type_python: "dict with keys 'name', 'ref'"
      - name: index
        type_matlab: "double"
        type_python: "int"
      - name: datestr
        type_matlab: "char"
        type_python: "str"
    decision_log: >
      The MATLAB nameref struct becomes a dict. `index` and `ref` keep their
      MATLAB values verbatim: they are user-facing record numbers, not array
      offsets, so no 1-based to 0-based shift is applied.

