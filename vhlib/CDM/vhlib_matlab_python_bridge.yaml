# MATLAB -> Python bridge contract for the vhlib.CDM package.
#
# Every module in this package must appear here, and every MATLAB function in
# the corresponding MATLAB folder must appear here with a `status`.
# See PORTING_INSTRUCTIONS for the convention and the status vocabulary.

project_metadata:
  bridge_version: "1.1"
  matlab_repository: "https://github.com/VH-Lab/vhlab-library-matlab"
  matlab_package_path: "AnalysisTools/CellDatabaseManagement"
  python_package: "vhlib.CDM"
  naming_policy: "Strict MATLAB Mirror"
  indexing_policy: "Semantic Parity (1-based for user concepts, 0-based for internal data)"
  coverage: "23 of 23 MATLAB functions in AnalysisTools/CellDatabaseManagement are ported."
  notes: >
    The Python package name `CDM` abbreviates the MATLAB folder name
    `CellDatabaseManagement`. MATLAB functions whose only purpose is to carry
    help text for a data file (testdirinfo, trainingtype, unitquality_channelshift,
    ...) are grouped into shared Python modules rather than getting one module
    each; `python_path` records where each one landed.

functions:
  - name: add_associate_variables
    type: function
    status: ported
    matlab_path: "AnalysisTools/CellDatabaseManagement/add_associate_variables.m"
    matlab_last_sync_hash: "cca1cce"
    python_path: "vhlib/CDM/add_associate_variables.py"
    input_arguments:
      - name: ds
        type_matlab: "dirstruct"
        type_python: "vlt.file.dirstruct.dirstruct"
      - name: cells
        type_matlab: "cell array (varargin)"
        type_python: "list | None"
        optional: true
    output_arguments:
      - name: cells
        type_matlab: "cell array (varargout)"
        type_python: "list"
    decision_log: >
      MATLAB's two calling forms (save-to-disk with one argument, return-modified
      with two) become a single Python function with an optional `cells` argument,
      matching the MATLAB semantics: cells are saved back to disk only when `cells`
      is omitted.

  - name: add_testdir_info
    type: function
    status: ported
    matlab_path: "AnalysisTools/CellDatabaseManagement/add_testdir_info.m"
    matlab_last_sync_hash: "cca1cce"
    python_path: "vhlib/CDM/add_testdir_info.py"
    input_arguments:
      - name: ds
        type_matlab: "dirstruct"
        type_python: "vlt.file.dirstruct.dirstruct"
      - name: cells
        type_matlab: "cell array"
        type_python: "list | None"
        optional: true
      - name: cellnames
        type_matlab: "cell array of char"
        type_python: "list of str | None"
        optional: true
    output_arguments:
      - name: assoc
        type_matlab: "struct array"
        type_python: "list of dict"
      - name: cells
        type_matlab: "cell array"
        type_python: "list"
    decision_log: >
      Exact match. MATLAB struct arrays of associates become lists of dicts
      throughout this package.

  - name: associate_variables_txt
    type: function
    status: ported
    matlab_path: "AnalysisTools/CellDatabaseManagement/associate_variables_txt.m"
    matlab_last_sync_hash: "cca1cce"
    python_path: "vhlib/CDM/associate_variables_txt.py"
    input_arguments: []
    output_arguments: []
    decision_log: >
      Help-only function documenting the 'associate_variables.txt' file format.
      The MATLAB help comment becomes the Python docstring; calling the function
      prints it, preserving the MATLAB behaviour of `associate_variables_txt` at
      the prompt.

  - name: cellname2date
    type: function
    status: ported
    matlab_path: "AnalysisTools/CellDatabaseManagement/cellname2date.m"
    matlab_last_sync_hash: "cca1cce"
    python_path: "vhlib/CDM/cellname2date.py"
    input_arguments:
      - name: cellname
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: datestr
        type_matlab: "char"
        type_python: "str"
    decision_log: >
      Exact match. Note that `vhlib/CDM/cellname2nameref.py` carries a second,
      private copy of this function so the module can be imported standalone;
      `vhlib.CDM.cellname2date` re-exports this one, which is authoritative.

  - name: cellname2nameref
