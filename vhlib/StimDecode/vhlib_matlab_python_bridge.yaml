  - name: getstimscript
    type: function
    status: ported
    matlab_path: "StimulusDecoding/getstimscript.m"
    matlab_last_sync_hash: "cca1cce"
    python_path: "vhlib/StimDecode/getstimscript.py"
    input_arguments:
      - name: dirname
        type_matlab: "char"
        type_python: "str"
    output_arguments:
      - name: thestimscript
        type_matlab: "stimscript (NewStim object)"
        type_python: "object, as produced by the .mat loader"
      - name: mti
        type_matlab: "struct array (variable MTI2)"
        type_python: "array of scipy mat_struct (squeezed: a one-element MTI2 arrives as a single struct)"
    decision_log: >
      Which repository's getstimscript NDI-matlab reaches was an open question
      (vhlab-library-python#6); it is settled, and this is the one. Three MATLAB
      files define the name, but only this one is a free function: the other two,
      vhlab-toolbox-matlab/file/@dirstruct/getstimscript.m and this repository's
      SpikeDataExtraction/SpikeImporters/OldSpikeImporters/@cksdirstruct/getstimscript.m,
      are class methods with the signature GETSTIMSCRIPT(DS, THEDIR), dispatched
      on a dirstruct or cksdirstruct object. NDI-matlab's two call sites,
      +ndi/+daq/+metadatareader/NewStimStims.m:35 and
      +ndi/+setup/+daq/+reader/+mfdaq/+stimulus/vhlabvisspike2.m:116, both pass a
      char directory path, so they resolve here regardless of MATLAB path order.
      There is no path-order ambiguity to resolve, and porting the dirstruct
      method is a separate question — vhlab-toolbox-python already carries it as
      vlt.file.dirstruct.dirstruct.getstimscript.

      The port stops where the NewStim object model begins. 'saveScript' is
      returned exactly as the .mat loader produces it: MATLAB writes it as a
      NewStim `stimscript` object, and with no Python NewStim there is nothing to
      convert it to. Callers that need stimulus parameters off it — NDI-matlab's
      NewStimStims.m calls numStims() and getparameters() — need a NewStim port
      first; what this function settles is where the file lives, which variables
      to read, and how the failures read. MTI2 is returned as loaded.

      Reading is delegated to vlt.file.dirstruct._load_mat_file, as
      repairoverflow_stimtimes_txt already does, so v7.3 files work and the two
      functions cannot disagree about how a stims.mat is read. MATLAB's two
      error() calls become FileNotFoundError with the same wording. MATLAB's
      load(...,'saveScript','MTI2') warns on a missing variable and then fails at
      the field access; the Python port raises KeyError naming every variable
      that is missing, which is the same failure said once.

